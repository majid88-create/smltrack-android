name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 dipilih eksplisit - ini yang cocok dengan AGP 8.5.2 + Gradle 8.7.
      # Karena versinya dipatok di sini, versi Java di laptop siapa pun tidak berpengaruh.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Pakai Gradle versi tetap 8.7 (tidak bergantung wrapper jar).
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMLTrack-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
